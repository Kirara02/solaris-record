base_locale: en
fallback_strategy: base_locale
input_directory: lib/src/shared/i18n
input_file_pattern: ".i18n.json"
output_directory: lib/src/shared/i18n/gen
output_file_pattern: ".g.dart"
string_interpolation: braces
# Load every locale eagerly. Deferred locales (the default) must be loaded
# asynchronously first; useDeviceLocaleSync() on an Indonesian device crashed in
# release builds with "Deferred library l_id was not loaded".
lazy: false
