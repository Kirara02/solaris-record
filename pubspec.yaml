name: solaris_record_app
description: "Wuthering Waves convene tracker."
publish_to: 'none'

version: 1.2.1+4

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.4
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  dynamic_color: ^2.1.0
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  intl: ^0.20.3
  logging: ^1.3.0
  material_3_expressive: ^1.1.6
  material_color_utilities: ^0.13.0
  material_ui: ^1.7.0
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  receive_sharing_intent: ^1.9.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_gen:
  output: lib/src/shared/assets/
  integrations:
    flutter_svg: true

# Launcher icons for every platform. The artwork is generated by
# tool/generate_app_icon.py (python3 tool/generate_app_icon.py), then applied with
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon_full.png
  android: true
  adaptive_icon_background: assets/icon/adaptive_background.png
  adaptive_icon_foreground: assets/icon/adaptive_foreground.png
  adaptive_icon_monochrome: assets/icon/adaptive_monochrome.png
  # The artwork is already drawn inside the adaptive safe zone (see
  # tool/generate_app_icon.py), so don't let the tool shrink it by 16% again.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon_full.png
    background_color: "#101438"
    theme_color: "#263080"
  windows:
    generate: true
    image_path: assets/icon/icon_rounded.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon_rounded.png
