name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Lets a push that only touched docs (and so was skipped above) be checked
  # by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite (for the database tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: ./.github/actions/flutter-setup

      - run: flutter analyze

      - run: flutter test
