name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite (for the database tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: ./.github/actions/flutter-setup

      - run: flutter analyze

      - run: flutter test
